name: 4dotnet CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC

jobs:
  # Job 1: Verify container image builds
  container-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check Docker availability
        run: docker --version
      
      - name: Build container image
        run: |
          BUILD_NETWORK=host ./tools/build-env/run.sh --build
        timeout-minutes: 15

  # Job 2: Verify arm64 defconfig
  defconfig-arm64:
    runs-on: ubuntu-latest
    needs: container-image
    steps:
      - uses: actions/checkout@v4
      
      - name: Checkout buildroot
        uses: actions/checkout@v4
        with:
          repository: oldzhu/buildroot
          path: buildroot
      
      - name: Build container image (if needed)
        run: |
          docker images | grep 4dotnet-build-env || BUILD_NETWORK=host ./tools/build-env/run.sh --build
      
      - name: Configure arm64 defconfig
        run: |
          BUILDROOT_DIR="$GITHUB_WORKSPACE/buildroot" ./tools/build-env/run.sh -- make distclean || true
          BUILDROOT_DIR="$GITHUB_WORKSPACE/buildroot" ./tools/build-env/run.sh -- make BR2_EXTERNAL=/work/4dotnet defconfig BR2_DEFCONFIG=/work/4dotnet/savedconfigs/arm64/br2.defconfig
        timeout-minutes: 10
      
      - name: Verify .config exists
        run: |
          test -f buildroot/.config && echo "PASS: .config generated" || echo "FAIL: .config missing"
          grep "BR2_PACKAGE_LLDB=y" buildroot/.config && echo "PASS: LLDB enabled" || echo "WARN: LLDB not in config"
          grep "BR2_PACKAGE_DOTNETRUNTIME=y" buildroot/.config && echo "PASS: dotnetruntime enabled" || echo "WARN: dotnetruntime not in config"

  # Job 3: Verify arm defconfig
  defconfig-arm:
    runs-on: ubuntu-latest
    needs: container-image
    steps:
      - uses: actions/checkout@v4
      
      - name: Checkout buildroot
        uses: actions/checkout@v4
        with:
          repository: oldzhu/buildroot
          path: buildroot
      
      - name: Configure arm defconfig
        run: |
          BUILDROOT_DIR="$GITHUB_WORKSPACE/buildroot" ./tools/build-env/run.sh -- make distclean || true
          BUILDROOT_DIR="$GITHUB_WORKSPACE/buildroot" ./tools/build-env/run.sh -- make BR2_EXTERNAL=/work/4dotnet defconfig BR2_DEFCONFIG=/work/4dotnet/savedconfigs/arm/br2.defconfig
        timeout-minutes: 10
      
      - name: Verify .config exists
        run: |
          test -f buildroot/.config && echo "PASS: .config generated" || echo "FAIL: .config missing"

  # Job 4: Shell script syntax check
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          scandir: './scripts'
        continue-on-error: true
